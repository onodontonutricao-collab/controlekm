<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle KM Pro</title>
<style>
body{font:16px system-ui;background:#f8fafc;color:#0f172a;margin:0}
body.dark{background:#0f172a;color:#e2e8f0}
header{background:linear-gradient(135deg,#0f766e,#0891b2);color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;opacity:.9}
main{max-width:900px;margin:auto;padding:16px}
nav{display:flex;gap:10px;overflow:auto;padding:14px;background:white;box-shadow:0 2px 10px rgba(0,0,0,.05)}
body.dark nav{background:#1e293b}
nav button{border:none;background:#e2e8f0;color:#0f172a;padding:14px 18px;border-radius:999px;font-weight:600}

nav button.active{background:#0f766e;color:white}

body.dark button,body.dark input,body.dark select,body.dark textarea{background:#1e293b;color:#e2e8f0;border-color:#475569}
button{cursor:pointer;background:#e2e8f0}
button.primary{background:#0f766e;color:white;border:none;font-weight:700}
button.danger{background:#fee2e2;color:#b91c1c;border:none}
label{display:block;margin:16px 0;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:8px;background:white}
textarea{min-height:90px}
article,.card{background:white;padding:20px;border-radius:20px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
body.dark article,body.dark .card{background:#1e293b}
small{display:block;color:#64748b;margin:10px 0}
body.dark small{color:#94a3b8}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.bar{height:14px;border-radius:999px;margin:8px 0}
output{display:block;padding:14px;background:#dcfce7;border-radius:12px;font-weight:700}
body.dark output{background:#14532d;color:#dcfce7}
h2{font-size:22px;margin:0 0 12px}
.stat{padding:18px;border-radius:18px;color:white;margin:10px 0}
.stat.green{background:#16a34a}
.stat.blue{background:#2563eb}
.stat.yellow{background:#ca8a04}
.stat.gray{background:#475569}
.stat h3{margin:0;font-size:16px;opacity:.9}
.stat p{margin:6px 0 0;font-size:26px;font-weight:800}

<header>
<h1>Controle KM Pro</h1>
<p>Empresa • Uber • Particular</p>
</header>
<nav id="nav"></nav>
<main>
<div id="status" role="status"></div>
<section id="view"></section>
</main><script>
const D={cars:[],trips:[],fuel:[],payments:[],costs:[],goals:[],maintenance:[]};
const K='controle_km_pro_v1';
function save(){localStorage.setItem(K,JSON.stringify(D))}
function load(){try{const x=JSON.parse(localStorage.getItem(K)||'{}');Object.assign(D,x)}catch(e){}}
function money(v){return 'R$ '+(Number(v)||0).toFixed(2).replace('.',',')}
function km(v){return (Number(v)||0).toLocaleString('pt-BR')+' km'}
function id(){return Date.now()+Math.random()}
function say(t){const s=document.getElementById('status');s.textContent=t;setTimeout(()=>s.textContent='',3000)}
function val(x){return Number(document.getElementById(x)?.value||0)}
function text(x){return document.getElementById(x)?.value||''}
function date(x){return text(x)}
function confirm(msg,fn){if(confirm(msg))fn()}
function add(list,item){list.push(item);save();say('Salvo com sucesso')}
function remove(list,i){list.splice(i,1);save();say('Removido')}
function update(list,i,item){list[i]=item;save();say('Atualizado')}
function month(d){return (d||'').slice(0,7)}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function filtered(list,field='date'){const m=state.month;if(m==='all')return list;return list.filter(x=>month(x[field])===m)}
const state={tab:'resumo',month:currentMonth(),car:'all',theme:'light'};
function carName(id){const c=D.cars.find(x=>x.id===id);return c?c.name:'Carro'}
function totalKm(list){return list.reduce((s,x)=>s+(Number(x.km)||0),0)}
function totalMoney(list){return list.reduce((s,x)=>s+(Number(x.value||x.amount||0)),0)}
function fuelConsumption(list,type){const f=filtered(list).filter(x=>x.type===type&&x.liters&&x.km).sort((a,b)=>a.date.localeCompare(b.date));let out=[];for(let i=1;i<f.length;i++){const km=f[i].km-f[i-1].km;const l=f[i].liters;if(km>0&&l>0)out.push(km/l)}if(!out.length)return 0;return out.reduce((a,b)=>a+b,0)/out.length}
function costPerKm(){const km=totalKm(filtered(D.trips));const cost=totalMoney(filtered(D.fuel))+totalMoney(filtered(D.costs));return km?cost/km:0}
function earnPerKm(){const km=totalKm(filtered(D.trips));const earn=totalMoney(filtered(D.payments))+totalMoney(filtered(D.trips.filter(x=>x.type==='uber')));return km?earn/km:0}
function profit(){const earn=totalMoney(filtered(D.payments))+totalMoney(filtered(D.trips.filter(x=>x.type==='uber')));const cost=totalMoney(filtered(D.fuel))+totalMoney(filtered(D.costs));return earn-cost}
function companyDue(){return totalKm(filtered(D.trips.filter(x=>x.type==='empresa')))}
function companyPaid(){return totalMoney(filtered(D.payments))}
function companyBalance(){return companyDue()-companyPaid()}
function goal(){const g=D.goals.find(x=>x.month===state.month);return g?Number(g.value):0}
function maintenanceAlert(){return D.maintenance.filter(x=>x.nextKm&&x.nextKm<=totalKm(D.trips))}
</script><script>
const tabs=[
['resumo','Resumo'],
['empresa','Empresa'],
['uber','Uber'],
['particular','Particular'],
['fuel','Abastecimentos'],
['payments','Pagamentos'],
['costs','Outros gastos'],
['cars','Carros'],
['goals','Metas'],
['maintenance','Manutenção'],
['reports','Relatórios'],
['backup','Backup']
];
function renderNav(){
const n=document.getElementById('nav');n.innerHTML='';
tabs.forEach(([k,label])=>{
const b=document.createElement('button');
b.textContent=label;
b.className=state.tab===k?'active':'';
b.onclick=()=>{state.tab=k;render()};
n.appendChild(b);
});
}
function monthFilter(){
const m=state.month;
const options=['all',...new Set([...D.trips,...D.fuel,...D.payments,...D.costs].map(x=>month(x.date)))].filter(Boolean);
return `
<label>Mês
<select id="month" onchange="state.month=this.value;render()">
${options.map(x=>`<option value="${x}" ${x===m?'selected':''}>${x==='all'?'Todos os meses':x}</option>`).join('')}
</select>
</label>`;
}
function carFilter(){
const c=state.car;
return `
<label>Carro
<select id="car" onchange="state.car=this.value;render()">
<option value="all" ${c==='all'?'selected':''}>Todos os carros</option>
${D.cars.map(x=>`<option value="${x.id}" ${x.id===c?'selected':''}>${x.name}</option>`).join('')}
</select>
</label>`;
}
function themeToggle(){
return `<button onclick="toggleTheme()">${document.body.classList.contains('dark')?'☀️ Modo claro':'🌙 Modo escuro'}</button>`;
}
function toggleTheme(){document.body.classList.toggle('dark');state.theme=document.body.classList.contains('dark')?'dark':'light';localStorage.setItem('theme',state.theme)}
function applyTheme(){if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark')}
function tripForm(type){
return `
<article>
<h2>Nova viagem ${type}</h2>
<label>Data<input type="date" id="date"></label>
<label>KM inicial<input type="number" id="start"></label>
<label>KM final<input type="number" id="end"></label>
${type==='uber'?`<label>Valor recebido<input type="number" id="value" step="0.01"></label>`:''}
<label>Observação<textarea id="note"></textarea></label>
<button class="primary" onclick="saveTrip('${type}')">Salvar viagem</button>
</article>`;
}
function saveTrip(type){
const start=val('start'),end=val('end');
if(!date('date')||!start||!end)return say('Preencha data e KM');
if(end<start)return say('KM final deve ser maior');
const item={id:id(),type,date:date('date'),start,end,km:end-start,value:type==='uber'?val('value'):0,note:text('note'),car:state.car==='all'?'':state.car};
add(D.trips,item);render();
}
function tripList(type){
const list=filtered(D.trips).filter(x=>x.type===type);
if(!list.length)return `<article><small>Nenhuma viagem registrada</small></article>`;
return list.map((x,i)=>{
return `
<article>
<h3>${x.date}</h3>
<p>KM: ${km(x.km)}</p>
${x.value?`<p>Valor: ${money(x.value)}</p>`:''}
${x.note?`<p>${x.note}</p>`:''}
<div class="actions">
<button onclick="editTrip('${type}',${i})">Editar</button>
<button class="danger" onclick="confirm('Excluir viagem?',()=>{remove(D.trips,D.trips.indexOf(x));render()})">Excluir</button>
</div>
</article>`;
}).join('');
}
function editTrip(type,i){
const x=filtered(D.trips).filter(y=>y.type===type)[i];
const real=D.trips.indexOf(x);
const start=prompt('KM inicial',x.start);if(start===null)return;
const end=prompt('KM final',x.end);if(end===null)return;
const value=prompt('Valor',x.value||0);if(value===null)return;
const note=prompt('Observação',x.note||'');if(note===null)return;
update(D.trips,real,{...x,start:Number(start),end:Number(end),km:Number(end)-Number(start),value:Number(value),note});
render();
}
function fuelForm(){
return `
<article>
<h2>Novo abastecimento</h2>
<label>Data<input type="date" id="date"></label>
<label>Combustível
<select id="type">
<option value="gasolina">Gasolina</option>
<option value="alcool">Álcool</option>
</select>
</label>
<label>Litros<input type="number" id="liters" step="0.01"></label>
<label>Preço por litro<input type="number" id="price" step="0.01"></label>
<label>Valor total<input type="number" id="total" step="0.01"></label>
<label>Odômetro<input type="number" id="km"></label>
<button class="primary" onclick="saveFuel()">Salvar abastecimento</button>
</article>`;
}
function saveFuel(){
if(!date('date'))return say('Preencha a data');
let liters=val('liters'),price=val('price'),total=val('total');
if(liters&&price&&!total)total=liters*price;
if(liters&&total&&!price)price=total/liters;
if(price&&total&&!liters)liters=total/price;
if(!liters||!price||!total)return say('Preencha pelo menos dois valores');
add(D.fuel,{id:id(),date:date('date'),type:text('type'),liters,price,total,km:val('km'),car:state.car==='all'?'':state.car});
render();
}
function fuelList(){
const list=filtered(D.fuel);
if(!list.length)return `<article><small>Nenhum abastecimento registrado</small></article>`;
return list.map(x=>`
<article>
<h3>${x.date}</h3>
<p>${x.type==='gasolina'?'Gasolina':'Álcool'}</p>
<p>${x.liters} litros</p>
<p>${money(x.total)}</p>
<p>${km(x.km)}</p>
<div class="actions">
<button class="danger" onclick="confirm('Excluir abastecimento?',()=>{remove(D.fuel,D.fuel.indexOf(x));render()})">Excluir</button>
</div>
</article>`).join('');
}
function paymentForm(){
return `
<article>
<h2>Novo pagamento</h2>
<label>Data<input type="date" id="date"></label>
<label>Valor recebido<input type="number" id="amount" step="0.01"></label>
<label>Observação<textarea id="note"></textarea></label>
<button class="primary" onclick="savePayment()">Salvar pagamento</button>
</article>`;
}
function savePayment(){
if(!date('date')||!val('amount'))return say('Preencha data e valor');
add(D.payments,{id:id(),date:date('date'),amount:val('amount'),note:text('note'),car:state.car==='all'?'':state.car});
render();
}
function paymentList(){
const list=filtered(D.payments);
if(!list.length)return `<article><small>Nenhum pagamento registrado</small></article>`;
return list.map(x=>`
<article>
<h3>${x.date}</h3>
<p>${money(x.amount)}</p>
${x.note?`<p>${x.note}</p>`:''}
<div class="actions">
<button class="danger" onclick="confirm('Excluir pagamento?',()=>{remove(D.payments,D.payments.indexOf(x));render()})">Excluir</button>
</div>
</article>`).join('');
}
function costForm(){
return `
<article>
<h2>Novo gasto</h2>
<label>Data<input type="date" id="date"></label>
<label>Descrição<input type="text" id="desc"></label>
<label>Valor<input type="number" id="value" step="0.01"></label>
<button class="primary" onclick="saveCost()">Salvar gasto</button>
</article>`;
}
function saveCost(){
if(!date('date')||!val('value'))return say('Preencha data e valor');
add(D.costs,{id:id(),date:date('date'),desc:text('desc'),value:val('value'),car:state.car==='all'?'':state.car});
render();
}
function costList(){
const list=filtered(D.costs);
if(!list.length)return `<article><small>Nenhum gasto registrado</small></article>`;
return list.map(x=>`
<article>
<h3>${x.date}</h3>
<p>${x.desc}</p>
<p>${money(x.value)}</p>
<div class="actions">
<button class="danger" onclick="confirm('Excluir gasto?',()=>{remove(D.costs,D.costs.indexOf(x));render()})">Excluir</button>
</div>
</article>`).join('');
}
</script><script>
function carForm(){
return `
<article>
<h2>Novo carro</h2>
<label>Nome<input type="text" id="carName"></label>
<label>Placa<input type="text" id="carPlate"></label>
<label>Ano<input type="number" id="carYear"></label>
<button class="primary" onclick="saveCar()">Salvar carro</button>
</article>`;
}
function saveCar(){
if(!text('carName'))return say('Preencha o nome do carro');
add(D.cars,{id:id(),name:text('carName'),plate:text('carPlate'),year:val('carYear')});
render();
}
function carList(){
if(!D.cars.length)return `<article><small>Nenhum carro cadastrado</small></article>`;
return D.cars.map(x=>`
<article>
<h3>${x.name}</h3>
<p>${x.plate||''}</p>
<p>${x.year||''}</p>
<div class="actions">
<button class="danger" onclick="confirm('Excluir carro?',()=>{remove(D.cars,D.cars.indexOf(x));render()})">Excluir</button>
</div>
</article>`).join('');
}
function goalForm(){
return `
<article>
<h2>Meta mensal</h2>
<label>Mês<input type="month" id="goalMonth" value="${currentMonth()}"></label>
<label>Valor da meta<input type="number" id="goalValue" step="0.01"></label>
<button class="primary" onclick="saveGoal()">Salvar meta</button>
</article>`;
}
function saveGoal(){
if(!date('goalMonth')||!val('goalValue'))return say('Preencha mês e valor');
const m=date('goalMonth');
const i=D.goals.findIndex(x=>x.month===m);
const item={month:m,value:val('goalValue')};
if(i>=0)update(D.goals,i,item);else add(D.goals,item);
render();
}
function goalList(){
if(!D.goals.length)return `<article><small>Nenhuma meta cadastrada</small></article>`;
return D.goals.map(x=>`
<article>
<h3>${x.month}</h3>
<p>${money(x.value)}</p>
<div class="actions">
<button class="danger" onclick="confirm('Excluir meta?',()=>{remove(D.goals,D.goals.indexOf(x));render()})">Excluir</button>
</div>
</article>`).join('');
}
function maintenanceForm(){
return `
<article>
<h2>Nova manutenção</h2>
<label>Data<input type="date" id="date"></label>
<label>Descrição<input type="text" id="desc"></label>
<label>Próxima revisão em KM<input type="number" id="nextKm"></label>
<button class="primary" onclick="saveMaintenance()">Salvar manutenção</button>
</article>`;
}
function saveMaintenance(){
if(!date('date')||!text('desc'))return say('Preencha data e descrição');
add(D.maintenance,{id:id(),date:date('date'),desc:text('desc'),nextKm:val('nextKm')});
render();
}
function maintenanceList(){
if(!D.maintenance.length)return `<article><small>Nenhuma manutenção cadastrada</small></article>`;
return D.maintenance.map(x=>`
<article>
<h3>${x.date}</h3>
<p>${x.desc}</p>
<p>Próxima revisão: ${km(x.nextKm)}</p>
<div class="actions">
<button class="danger" onclick="confirm('Excluir manutenção?',()=>{remove(D.maintenance,D.maintenance.indexOf(x));render()})">Excluir</button>
</div>
</article>`).join('');
}
function reports(){
return `
<article>
<h2>Relatórios</h2>
<button class="primary" onclick="exportPDF()">Exportar PDF</button>
<button onclick="exportExcel()">Exportar Excel</button>
</article>`;
}
function exportPDF(){
const w=window.open('','_blank');
w.document.write(`
<h1>Controle KM Pro</h1>
<h2>Resumo</h2>
<p>KM total: ${km(totalKm(filtered(D.trips)))}</p>
<p>Custo por km: ${money(costPerKm())}</p>
<p>Ganho por km: ${money(earnPerKm())}</p>
<p>Lucro: ${money(profit())}</p>
`);
w.print();
}
function exportExcel(){
let csv='Tipo;Data;KM;Valor;Observação\n';
D.trips.forEach(x=>csv+=`${x.type};${x.date};${x.km};${x.value||0};${x.note||''}\n`);
D.fuel.forEach(x=>csv+=`Abastecimento;${x.date};${x.km||0};${x.total};${x.type}\n`);
D.payments.forEach(x=>csv+=`Pagamento;${x.date};0;${x.amount};${x.note||''}\n`);
D.costs.forEach(x=>csv+=`Gasto;${x.date};0;${x.value};${x.desc||''}\n`);
const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='controle_km.csv';
a.click();
}
function backup(){
return `
<article>
<h2>Backup</h2>
<button class="primary" onclick="exportData()">Exportar backup</button>
<label>Importar backup<input type="file" id="file" onchange="importData(event)"></label>
</article>`;
}
function exportData(){
const blob=new Blob([JSON.stringify(D)],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='backup_controle_km.json';
a.click();
}
function importData(e){
const f=e.target.files[0];
if(!f)return;
const r=new FileReader();
r.onload=()=>{try{const x=JSON.parse(r.result);Object.assign(D,x);save();render();say('Backup importado')}catch(err){say('Arquivo inválido')}};
r.readAsText(f);
}
function resumo(){
const km=totalKm(filtered(D.trips));
return `
${monthFilter()}
${carFilter()}
<article>
<h2>Resumo</h2>
<div class="stat green"><h3>KM total</h3><p>${km(km)}</p></div>
<div class="stat blue"><h3>Empresa a receber</h3><p>${money(companyBalance())}</p></div>
<div class="stat yellow"><h3>Custo por km</h3><p>${money(costPerKm())}</p></div>
<div class="stat gray"><h3>Ganho por km</h3><p>${money(earnPerKm())}</p></div>
</article>
<article>
<h2>Consumo</h2>
<p>Gasolina: ${fuelConsumption(D.fuel,'gasolina').toFixed(2)} km/l</p>
<p>Álcool: ${fuelConsumption(D.fuel,'alcool').toFixed(2)} km/l</p>
</article>
<article>
<h2>Lucro</h2>
<p>${money(profit())}</p>
</article>
<article>
<h2>Meta</h2>
<p>Meta do mês: ${money(goal())}</p>
</article>
<article>
<h2>Manutenção</h2>
${maintenanceAlert().length?maintenanceAlert().map(x=>`<p>⚠️ ${x.desc}</p>`).join(''):'<small>Nenhum alerta</small>'}
</article>
${themeToggle()}
`;
}
function empresa(){
return `
${monthFilter()}
${carFilter()}
<article>
<h2>Empresa</h2>
<p>Total de km: ${km(companyDue())}</p>
<p>Valor devido: ${money(companyDue())}</p>
<p>Pago: ${money(companyPaid())}</p>

${paymentList()}

}

}

<article>

${monthFilter()}
${carFilter()}
<article>
<h2>Outros gastos</h2>

${carForm()}
${carList()}

${goalForm()}
${goalList()}

function manutencao(){
