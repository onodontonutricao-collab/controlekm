<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle KM</title><style>body{font:16px system-ui;background:#f1f5f9;color:#123;margin:0}header{background:#0f766e;color:white;padding:18px}main{max-width:850px;margin:auto;padding:16px}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:white}button,input,select,textarea{font:inherit;padding:14px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}button{cursor:pointer;background:#e2e8f0}button.primary{background:#0f766e;color:white}label{display:block;margin:14px 0}input,select,textarea{display:block;width:100%;margin-top:6px}textarea{min-height:80px}article,.card{background:white;padding:18px;border-radius:16px;margin:12px 0}small{display:block;color:#475569;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.bar{background:#0f766e;height:18px;border-radius:8px;margin:5px 0}output{display:block;padding:12px;background:#dcfce7}h2{font-size:22px}</style><header><b>Controle de KM • Empresa, Uber e Particular</b></header><nav id="nav"></nav><main><div id="status" role="status"></div><section id="view"></section></main><script>
const groups={empresa:'Empresa',uber:'Uber',particular:'Particular',abastecimentos:'Abastecimentos',pagamentos:'Pagamentos Empresa',gastos:'Outros gastos'};
const KEY='controle_km_estavel';let D=Object.fromEntries(Object.keys(groups).map(k=>[k,[]])),tab='resumo',editing=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),num=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
function parse(v){v=String(v).trim();if(!v)return NaN;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return /^\d+(\.\d+)?$/.test(v)?Number(v):NaN}
function msg(s){$('status').textContent=s}
try{const raw=localStorage.getItem(KEY);if(raw)D=validate(JSON.parse(raw));else{for(let i=10;i>=1;i--){const old=localStorage.getItem('controle_km_app_v'+i);if(old){try{D=validate(JSON.parse(old));msg('Dados locais de uma versão anterior recuperados. Exporte um backup.');break}catch(e){}}}}}catch(e){msg('Armazenamento indisponível ou dados incompatíveis. Importe um backup se necessário.')}
function validate(o){if(!o||typeof o!=='object')throw Error('Arquivo inválido');const d=o.dados||o;if(!Object.keys(groups).some(k=>Array.isArray(d[k])))throw Error('Backup incompatível');const r={};for(const k of Object.keys(groups)){if(d[k]!==undefined&&!Array.isArray(d[k]))throw Error('Lista inválida: '+k);r[k]=(d[k]||[]).map((x,i)=>{if(!x||typeof x!=='object'||!/^\d{4}-\d{2}-\d{2}$/.test(x.data||''))throw Error('Registro sem data válida');const y={...x,id:String(x.id||k+'_'+i)};const fields=['valor','total','litros','preco','km','kmIni','kmFim','extra'];for(const f of fields)if(y[f]!==undefined&&(!Number.isFinite(Number(y[f]))||Number(y[f])<0))throw Error('Número inválido: '+f);if(['empresa','uber','particular'].includes(k)){y.kmIni=Number(y.kmIni??x.inicial);y.kmFim=Number(y.kmFim??x.final);if(!Number.isFinite(y.kmIni)||!Number.isFinite(y.kmFim)||y.kmFim<y.kmIni)throw Error('KM inválido no backup');y.km=y.kmFim-y.kmIni;if(k==='empresa')y.valor=y.km;}return y})}return r}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));D=next;return true}catch(e){msg('Não foi possível salvar. Não feche esta tela; exporte backup dos dados existentes.');return false}}
function go(k){tab=k;editing=null;render()}
$('nav').innerHTML=['resumo',...Object.keys(groups),'backup'].map(k=>`<button onclick="go('${k}')">${groups[k]|| (k==='resumo'?'Resumo':'Backup')}</button>`).join('');
const sum=(k,f)=>D[k].reduce((s,x)=>s+Number(x[f]||0),0);
function field(id,label,type='text',value=''){return `<label>${label}<input id="${id}" type="${type}" ${type==='text'?'inputmode="decimal"':''} value="${esc(value)}" required></label>`}
function render(){const v=$('view');if(tab==='backup'){v.innerHTML=`<article><h2>Backup completo</h2><p>Inclui históricos, viagens, abastecimentos, pagamentos e gastos.</p><button class="primary" onclick="exportBackup()">Exportar backup JSON</button><label>Importar backup<input type="file" accept=".json,application/json" onchange="importBackup(this.files[0])"></label><small>A importação substitui todos os dados após confirmação. Exporte o backup atual antes. Os arquivos antigos só podem ser recuperados se o navegador disponibilizar seu armazenamento.</small></article>`;return}
if(tab==='resumo'){let total=['empresa','uber','particular'].reduce((s,k)=>s+sum(k,'km'),0),due=sum('empresa','km'),paid=sum('pagamentos','valor');v.innerHTML=`<article><h2>Resumo</h2><p>Total gerado Empresa: <b>${money(due)}</b></p><p>Recebido: <b>${money(paid)}</b></p><p>Saldo pendente: <b>${money(due-paid)}</b></p><small>Empresa: R$ 1,00/km, sem desconto de combustível. Saldo negativo indica adiantamento.</small><p>Combustível comprado: ${money(sum('abastecimentos','total'))}</p><p>KM registrados: ${num(total)}</p></article><article><h2>KM por categoria</h2>${['empresa','uber','particular'].map(k=>`<p>${groups[k]}: <b>${num(sum(k,'km'))} km</b></p><div class="bar" style="width:${total?100*sum(k,'km')/total:0}%"></div>`).join('')}</article><article><h2>Consumo medido</h2>${consumption()}</article>`;return}
const x=editing?D[tab].find(x=>x.id===editing):{};let form=field('data','Data','date',x.data||today());
if(['empresa','uber','particular'].includes(tab)){form+=field('kmIni','KM inicial (sem separador de milhar)','text',x.kmIni??'')+field('kmFim','KM final (sem separador de milhar)','text',x.kmFim??'')+'<output id="preview">Informe os dois KM.</output>';if(tab!=='empresa')form+=field('valor',tab==='uber'?'Valor recebido Uber':'Valor particular (0 se não houver)','text',x.valor??0)}
if(tab==='abastecimentos')form+=`<label>Combustível<select id="tipo"><option ${x.tipo==='Gasolina'?'selected':''}>Gasolina</option><option ${x.tipo==='Álcool'?'selected':''}>Álcool</option></select></label><label>Calcular automaticamente<select id="calc"><option value="litros">Litros (total ÷ preço)</option><option value="total">Valor total (litros × preço)</option><option value="preco">Preço por litro (total ÷ litros)</option></select></label>`+field('litros','Litros','text',x.litros??'')+field('preco','Preço por litro','text',x.preco??'')+field('total','Valor total','text',x.total??'')+field('km','KM odômetro','text',x.km??'')+`<label><input style="display:inline;width:auto" type="checkbox" id="cheio" ${x.cheio?'checked':''}> Tanque cheio (até primeiro desarme)</label><small>Marque tanque cheio para medir consumo entre enchimentos. Misturas de combustível aparecem como “Misto”.</small>`;
if(tab==='pagamentos')form+=field('valor','Valor recebido','text',x.valor??'')+`<label>Referência<input id="referencia" value="${esc(x.referencia)}"></label>`;
if(tab==='gastos')form+=field('valor','Valor do gasto','text',x.valor??'')+`<label>Categoria<select id="uso">${['Geral','Empresa','Uber','Particular'].map(k=>`<option ${x.uso===k?'selected':''}>${k}</option>`).join('')}</select></label>`;
form+=`<label>Trajeto / posto / observação<textarea id="obs">${esc(x.obs)}</textarea></label><button class="primary" type="submit">${editing?'Salvar alterações':'Salvar lançamento'}</button> <button type="button" onclick="go(tab)">Cancelar / novo</button>`;
v.innerHTML=`<article><h2>${editing?'Editar':'Novo registro'} — ${groups[tab]}</h2><form id="form">${form}</form></article><h2>Histórico — ${groups[tab]}</h2><div id="history"></div>`;
$('form').onsubmit=saveRecord;
$('history').innerHTML=D[tab].length?[...D[tab]].sort((a,b)=>b.data.localeCompare(a.data)).map(x=>`<article><b>${esc(x.data)}</b>${Object.entries(x).filter(([k])=>!['id','data'].includes(k)).map(([k,v])=>`<p>${esc(({kmIni:'KM inicial',kmFim:'KM final',km:'KM',valor:'Valor (R$)',total:'Total (R$)',preco:'Preço/L (R$)',litros:'Litros',obs:'Observação',cheio:'Tanque cheio'})[k]||k)}: ${esc(typeof v==='boolean'?(v?'Sim':'Não'):v)}</p>`).join('')}<div class="actions"><button data-id="${esc(x.id)}" onclick="edit(this.dataset.id)">Editar</button><button data-id="${esc(x.id)}" onclick="del(this.dataset.id)">Excluir</button></div></article>`).join(''):'<article>Nenhum lançamento.</article>';
if($('kmIni'))for(const id of ['kmIni','kmFim'])$(id).oninput=()=>{const a=parse($('kmIni').value),b=parse($('kmFim').value);$('preview').textContent=!Number.isFinite(a+b)?'Preencha os dois campos.':b<a?'KM final menor que inicial. Verifique os valores.':num(b-a)+' km'+(tab==='empresa'?' • '+money(b-a):'')};
if($('calc')){for(const id of ['calc','litros','preco','total'])$(id).addEventListener(id==='calc'?'change':'input',fuelCalc);fuelCalc()}}
function fuelCalc(){let target=$('calc').value;for(const k of ['litros','preco','total']){$(k).readOnly=k===target;$(k).required=k!==target}let l=parse($('litros').value),p=parse($('preco').value),t=parse($('total').value);let n=target==='litros'?t/p:target==='total'?l*p:t/l;$(target).value=Number.isFinite(n)&&n>0?n.toFixed(target==='total'?2:4):''}
function saveRecord(e){e.preventDefault();const x={id:editing||String(Date.now())+'_'+Math.random().toString(36).slice(2),data:$('data').value,obs:$('obs').value};for(const k of ['kmIni','kmFim','valor','litros','preco','total','km'])if($(k)){x[k]=parse($(k).value);if(!Number.isFinite(x[k])||x[k]<0){msg('Valor inválido em '+k+'. Use números sem separador de milhar, exemplo 12345,6.');return}}
if('kmIni'in x){if(x.kmFim<x.kmIni){msg('KM final menor que inicial. Corrija os campos; não serão invertidos automaticamente.');return}x.km=x.kmFim-x.kmIni;if(tab==='empresa')x.valor=x.km}
if(tab==='abastecimentos'){if(x.litros<=0||x.preco<=0||x.total<=0){msg('Abastecimento deve ter valores positivos.');return}x.tipo=$('tipo').value;x.cheio=$('cheio').checked}
if(tab==='pagamentos')x.referencia=$('referencia').value;if(tab==='gastos')x.uso=$('uso').value;
const next=JSON.parse(JSON.stringify(D));if(editing)next[tab]=next[tab].map(r=>r.id===editing?x:r);else next[tab].push(x);if(persist(next)){editing=null;render();msg('Salvo no histórico. Faça backup regularmente.')}}
function edit(id){editing=id;render();window.scrollTo(0,0)}
function del(id){if(confirm('Excluir este registro?')){const next=JSON.parse(JSON.stringify(D));next[tab]=next[tab].filter(x=>x.id!==id);if(persist(next)){editing=null;render()}}}
function consumption(){const a=[...D.abastecimentos].sort((a,b)=>a.data.localeCompare(b.data)||a.km-b.km);let start=null,l=0,cost=0,types=new Set(),out=[];for(const x of a){if(start!==null){l+=Number(x.litros);cost+=Number(x.total);types.add(x.tipo)}if(x.cheio){if(start!==null&&x.km>start&&l>0){const km=x.km-start;out.push(`<p>${esc(x.data)} • ${types.size===1?esc([...types][0]):'Misto'}: <b>${num(km/l)} km/L</b> • ${money(cost/km)}/km</p>`)}start=Number(x.km);l=0;cost=0;types=new Set([x.tipo])}}return out.join('')||'Ainda sem intervalo completo entre dois tanques cheios. Não apresentamos preço por litro como se fosse consumo.'}
function exportBackup(){const blob=new Blob([JSON.stringify({formato:'controle-km',versao:1,exportado:new Date().toISOString(),dados:D},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup_controle_km_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);msg('Backup gerado. Confira o arquivo na pasta Downloads.')}
async function importBackup(file){if(!file)return;try{const next=validate(JSON.parse(await file.text()));const count=Object.values(next).reduce((s,a)=>s+a.length,0);if(!confirm('Restaurar '+count+' registros? Isso substituirá TODOS os dados atuais. Exporte um backup antes.'))return;if(persist(next)){editing=null;render();msg('Backup restaurado com sucesso.')}}catch(e){msg('Importação cancelada: '+e.message+'. Os dados atuais foram preservados.')}}
render();
</script></html>
